# The agent reviews gate. Two AI reviewers look at every pull request: Kilo Code Review (a
# check run) and CodeRabbit (a commit status). Both report success whatever they find, and
# CodeRabbit's status turns successful even when it was rate limited and never reviewed the
# commit. So, besides their own checks, main requires (branch protection):
#   - every review thread resolved: a finding holds the merge (and auto-merge) until it is
#     fixed and its thread resolved by whoever fixed it, or resolved to dismiss it;
#   - this check, "CodeRabbit reviewed": it passes only once CodeRabbit's status on the
#     commit says "Review completed". Rate limited, failed or skipped, it fails; a PR comment
#     "@coderabbitai review" asks for the review again, and this check follows.
# A workflow triggered by `status` runs from main, so it posts its check run on the commit
# the status is for (the PR's head) through the API. Each run reads CodeRabbit's latest
# status on the commit, and runs for one commit queue in order, so the last word is the
# latest status. Run it by hand (Actions → Agent reviews) to check a commit again.
name: Agent reviews

on:
  status:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to check again (full SHA)
        required: true

permissions:
  checks: write
  statuses: read

concurrency:
  group: coderabbit-reviewed-${{ github.event.sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  coderabbit:
    name: CodeRabbit reviewed (gate)
    if: github.event_name == 'workflow_dispatch' || github.event.context == 'CodeRabbit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post "CodeRabbit reviewed" on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.sha || inputs.sha }}
        run: |
          set -euo pipefail
          line="$(gh api "repos/$REPO/commits/$SHA/status" --jq '.statuses[] | select(.context == "CodeRabbit") | "\(.state)\t\(.description // "")"' | head -n 1)"
          state="${line%%$'\t'*}"; desc="${line#*$'\t'}"
          [ -n "$line" ] || { state=missing; desc="no CodeRabbit status on this commit"; }
          echo "CodeRabbit on $SHA: $state ($desc)"
          again='Comment `@coderabbitai review` on the pull request to ask for the review again; this check follows its status.'
          case "$state:$desc" in
            pending:*)
              args=(-f status=in_progress -f "output[title]=CodeRabbit is reviewing" -f "output[summary]=Waiting for CodeRabbit to finish its review of this commit.") ;;
            "success:Review completed"*)
              args=(-f status=completed -f conclusion=success -f "output[title]=CodeRabbit reviewed this commit" -f "output[summary]=CodeRabbit finished its review. Its findings are review threads, which must be resolved before merging.") ;;
            *)
              args=(-f status=completed -f conclusion=failure -f "output[title]=CodeRabbit did not review this commit: $desc" -f "output[summary]=$again") ;;
          esac
          gh api "repos/$REPO/check-runs" -f name="CodeRabbit reviewed" -f head_sha="$SHA" "${args[@]}" --jq '"posted \(.name): \(.status) \(.conclusion // "")"'
