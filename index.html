<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pyramid Builders</title>
<style>
  :root { --ink: #fbf3e2; --dim: rgba(251, 243, 226, 0.66); --panel: rgba(28, 20, 12, 0.62); --edge: rgba(255, 220, 160, 0.18); --gold: #e9b949; --warn: #ff9a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9c39a; font: 13px/1.35 "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  .glass { background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--edge); border-radius: 12px; }
  #status { position: fixed; top: 12px; left: 12px; padding: 9px 12px 10px; width: 290px; pointer-events: none; }
  #status h1 { margin: 0 0 3px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  #phase { font-size: 13px; }
  #timeline { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: min(700px, calc(100% - 24px)); display: flex; align-items: center; gap: 8px; padding: 5px 10px; z-index: 5; }
  #timeline button { appearance: none; border: 0; background: rgba(255,255,255,0.08); color: var(--ink); width: 26px; height: 22px; border-radius: 6px; cursor: pointer; font: 600 11px/1 system-ui; padding: 0; }
  #timeline button.wide { width: auto; padding: 0 8px; font-weight: 500; }
  #timeline #speed { min-width: 46px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #timeline button.on { background: var(--gold); color: #2a1c08; }
  #timeline .tsep { width: 1px; height: 16px; background: var(--edge); }
  #timeline button:hover { background: rgba(255,255,255,0.18); }
  #scrub { flex: 1; min-width: 0; height: 18px; accent-color: var(--gold); cursor: pointer; }
  #scrubLabel { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); min-width: 62px; text-align: right; font-variant-numeric: tabular-nums; }
  #seeking { position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 14px; display: none; text-align: center; }
  #seeking .track { height: 4px; width: 220px; background: rgba(255,255,255,0.14); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #seeking .track i { display: block; height: 100%; width: 0; background: var(--gold); }
  #event { margin-top: 6px; color: var(--dim); font-size: 12px; min-height: 16px; }
  #khufu { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--gold); pointer-events: auto; }
  #wares { position: fixed; left: 12px; bottom: 12px; padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 360px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,0.08); font-size: 12px; white-space: nowrap; }
  .chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.low { background: rgba(255, 120, 80, 0.32); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  #controls { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 4px; padding: 5px; align-items: center; }
  #controls button { appearance: none; border: 0; background: rgba(255,255,255,0.08); color: var(--ink); height: 32px; min-width: 34px; padding: 0 10px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; }
  #controls button:hover { background: rgba(255,255,255,0.18); }
  #controls button.on { background: var(--gold); color: #2a1c08; }
  #controls .sep { width: 1px; height: 20px; background: var(--edge); margin: 0 3px; }
  #speed { min-width: 52px !important; font-variant-numeric: tabular-nums; }
  #map { position: fixed; right: 12px; top: 12px; padding: 8px; width: 236px; display: none; }
  #map.show { display: block; }
  #map h2 { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; display: flex; justify-content: space-between; }
  #map canvas { width: 220px; height: 220px; border-radius: 8px; background: rgba(0,0,0,0.25); }
  #rooms { margin-top: 6px; display: grid; gap: 3px; }
  #rooms button { appearance: none; text-align: left; border: 0; background: rgba(255,255,255,0.07); color: var(--ink); border-radius: 7px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; }
  #rooms button:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
  #rooms button:disabled { opacity: 0.45; cursor: default; }
  #rooms span { color: var(--dim); font-variant-numeric: tabular-nums; }
  #hint { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); padding: 6px 12px; font-size: 12px; color: var(--dim); display: none; pointer-events: none; }
  #inspect { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 6px 12px; display: none; pointer-events: none; text-align: center; max-width: min(420px, calc(100% - 32px)); }
  #inspect b { display: block; font-size: 13px; color: var(--gold); }
  #inspect span { display: block; font-size: 12px; color: var(--ink); }
  #inspect em { display: block; font-style: normal; font-size: 11px; color: var(--dim); margin-top: 2px; }
  #tourCaption { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); width: min(640px, calc(100% - 24px)); padding: 12px 16px 12px; display: none; transition: opacity 0.3s; }
  #tourCaption b { display: block; font-size: 17px; color: var(--gold); margin-bottom: 2px; }
  #tourCaption span { display: block; font-size: 14px; color: var(--ink); }
  #tourCaption button { position: absolute; top: 8px; right: 8px; appearance: none; border: 0; background: rgba(255,255,255,0.1); color: var(--dim); border-radius: 6px; font: 11px system-ui; padding: 3px 8px; cursor: pointer; }
  body.touring #wares, body.touring #map, body.touring #timeline, body.touring #coords { display: none !important; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,0.75); display: none; pointer-events: none; }
  .label { padding: 2px 7px; border-radius: 6px; background: rgba(20, 14, 8, 0.72); border: 1px solid rgba(233, 185, 73, 0.5); color: #fff4d8; font-size: 11px; white-space: nowrap; pointer-events: none; }
  .label small { color: #e9b949; margin-left: 4px; }
  #coords { position: fixed; right: 12px; bottom: 58px; padding: 3px 9px; border: 1px solid var(--edge); border-radius: 8px; background: var(--panel); color: var(--dim); font: 11px/1.5 ui-monospace, Menlo, monospace; cursor: pointer; user-select: all; }
  #coords:hover { color: var(--ink); }
  /* the timeline sits between the side panels; on narrower screens they drop below it */
  @media (max-width: 1180px) { #status, #map { top: 56px; } }
  @media (max-width: 720px) { #status { width: auto; right: 12px; } #wares { display: none; } #map { top: auto; bottom: 60px; } }
</style>
</head>
<body>
<div id="timeline" class="glass">
  <button id="pause" title="Pause / play (P)">❚❚</button>
  <button id="speed" class="wide" title="Simulation speed: click for faster, shift-click or right-click for slower (+/−)">16×</button>
  <span class="tsep"></span>
  <button id="toStart" title="Back to the beginning">⏮</button>
  <button id="prevDay" class="wide" title="Back one day">◂ Day</button>
  <input id="scrub" type="range" min="0" max="33000" step="60" value="0" aria-label="Jump to a moment in the build">
  <button id="nextDay" class="wide" title="Forward one day">Day ▸</button>
  <button id="toEnd" title="Skip to the finished tomb">⏭</button>
  <span id="scrubLabel">day 1</span>
</div>
<div id="status" class="glass">
  <h1>Pyramid Builders</h1>
  <div id="phase">Preparing the site…</div>
  <div id="event"></div>
  <a id="khufu" href="./khufu.html">Khufu's pyramid at Giza, at full scale →</a>
</div>
<div id="wares" class="glass"></div>
<div id="map" class="glass">
  <h2><span>Interior plan</span><span id="mapLevel"></span></h2>
  <canvas id="mapCanvas" width="440" height="440"></canvas>
  <div id="rooms"></div>
</div>
<div id="seeking" class="glass"><span id="seekText">Fast-forwarding…</span><div class="track"><i id="seekBar"></i></div></div>
<div id="hint" class="glass">WASD walk · drag to look around (or click to lock the mouse) · Shift run · Esc release</div>
<div id="tourCaption" class="glass"><b id="tourTitle"></b><span id="tourSub"></span><button id="tourEnd" title="End the tour">End tour</button></div>
<div id="cross"></div>
<div id="inspect" class="glass"><b id="inspectName"></b><span id="inspectDetail"></span><em id="inspectAction"></em></div>
<div id="coords" title="Camera position and the point it looks at, in metres (x east, y up, z south). Click to copy.">cam –</div>
<div id="controls" class="glass">
  <button id="reset" title="Restart construction">↺</button>
  <span class="sep"></span>
  <button id="xray" title="Transparency (X)">X-ray</button>
  <button id="fps" title="First-person (F)">Walk</button>
  <button id="tour" title="Play a guided tour from the first day to the finished tomb">Tour</button>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
