<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khufu's Pyramid</title>
<style>
  :root { --ink: #fbf3e2; --dim: rgba(251, 243, 226, 0.66); --panel: rgba(28, 20, 12, 0.62); --edge: rgba(255, 220, 160, 0.18); --gold: #e9b949; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9c39a; font: 13px/1.35 "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  a { color: var(--gold); }
  .glass { background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--edge); border-radius: 12px; }
  #left { position: fixed; top: 12px; left: 12px; width: 300px; max-height: calc(100% - 82px); display: flex; flex-direction: column; gap: 8px; }
  #status { padding: 9px 12px 10px; flex: none; }
  #status h1 { margin: 0 0 3px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  #where { font-size: 13px; }
  #note { color: var(--dim); font-size: 12px; margin-top: 3px; min-height: 16px; }
  #stats { margin-top: 6px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--dim); font-variant-numeric: tabular-nums; }
  #back { display: inline-block; margin-top: 6px; font-size: 12px; }
  #rooms { position: fixed; right: 12px; top: 12px; padding: 8px; width: 210px; display: grid; gap: 3px; }
  #rooms h2 { margin: 0 0 3px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  #rooms button { appearance: none; text-align: left; border: 0; background: rgba(255,255,255,0.07); color: var(--ink); border-radius: 7px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; }
  #rooms button:hover { background: rgba(255,255,255,0.16); }
  #rooms span { color: var(--dim); font-variant-numeric: tabular-nums; }
  #controls { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 4px; padding: 5px; align-items: center; }
  #controls button { appearance: none; border: 0; background: rgba(255,255,255,0.08); color: var(--ink); height: 32px; min-width: 34px; padding: 0 10px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; }
  #controls button:hover { background: rgba(255,255,255,0.18); }
  #controls button.on { background: var(--gold); color: #2a1c08; }
  #controls .sep { width: 1px; height: 20px; background: var(--edge); margin: 0 3px; }
  #controls label { display: flex; align-items: center; gap: 6px; padding: 0 6px; color: var(--dim); font-size: 12px; }
  #courses { width: 150px; accent-color: var(--gold); }
  #courseLabel { min-width: 74px; font-variant-numeric: tabular-nums; color: var(--ink); }
  #hint { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; font-size: 12px; color: var(--dim); display: none; pointer-events: none; text-align: center; }
  #climb { position: fixed; left: 50%; top: calc(50% + 28px); transform: translateX(-50%); padding: 4px 10px; font-size: 12px; color: var(--ink); display: none; pointer-events: none; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,0.75); display: none; pointer-events: none; }
  .label { padding: 2px 7px; border-radius: 6px; background: rgba(20, 14, 8, 0.72); border: 1px solid rgba(233, 185, 73, 0.5); color: #fff4d8; font-size: 11px; white-space: nowrap; pointer-events: none; }
  /* timeline in years, between the side panels */
  #timeline { position: fixed; top: 12px; left: 324px; right: 234px; padding: 6px 10px 5px; z-index: 5; }
  #timeline .trow { display: flex; align-items: center; gap: 5px; }
  #timeline button { appearance: none; border: 0; background: rgba(255,255,255,0.08); color: var(--ink); min-width: 26px; height: 24px; border-radius: 6px; cursor: pointer; font: 600 11px/1 system-ui; padding: 0 6px; white-space: nowrap; }
  #timeline button:hover:not(:disabled) { background: rgba(255,255,255,0.18); }
  #timeline button.on { background: var(--gold); color: #2a1c08; }
  #timeline button:disabled, #timeline input:disabled { opacity: 0.4; cursor: default; }
  #timeline #speed { min-width: 74px; font-variant-numeric: tabular-nums; font-weight: 500; }
  #timeline .tsep { width: 1px; height: 16px; background: var(--edge); flex: none; }
  #track { position: relative; flex: 1; min-width: 80px; height: 42px; }
  #scrub { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 18px; margin: 0; accent-color: var(--gold); cursor: pointer; }
  #marks, #years { position: absolute; left: 8px; right: 8px; }
  #marks { top: 20px; height: 10px; }
  #timeline .mark { position: absolute; top: 0; width: 9px; min-width: 0; height: 9px; padding: 0; margin-left: -4.5px; border-radius: 2px; transform: rotate(45deg); background: rgba(233,185,73,0.45); border: 1px solid rgba(20,14,8,0.6); }
  #timeline .mark.past { background: var(--gold); }
  #timeline .mark.ramp { background: rgba(150,196,230,0.5); } #timeline .mark.ramp.past { background: #96c4e6; }
  #timeline .mark.course { background: rgba(251,243,226,0.4); } #timeline .mark.course.past { background: var(--ink); }
  #timeline .mark:hover { transform: rotate(45deg) scale(1.4); background: #fff; }
  #years { top: 31px; height: 11px; pointer-events: none; }
  #years i { position: absolute; top: 0; width: 1px; height: 3px; background: rgba(251,243,226,0.3); }
  #years i.big { height: 5px; background: var(--dim); }
  #years i.big::after { content: 'year ' attr(data-y); position: absolute; left: 3px; top: 0; font: 9px/1 ui-monospace, Menlo, monospace; color: var(--dim); white-space: nowrap; }
  #timeline .crow { display: flex; gap: 10px; align-items: baseline; margin-top: 1px; min-height: 16px; }
  #clock { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #clockSub { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #milestone { margin-left: auto; color: var(--gold); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* statistics panel */
  #simstats { padding: 8px 12px 10px; overflow-y: auto; min-height: 0; flex: 0 1 auto; font-variant-numeric: tabular-nums; }
  #simstats h2 { margin: 0; }
  #simstats h2 button { appearance: none; border: 0; background: none; padding: 0; width: 100%; display: flex; justify-content: space-between; cursor: pointer; font: 600 11px/1.4 system-ui; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
  #simstats h3 { margin: 9px 0 3px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #simstats .big { font-size: 14px; font-weight: 600; margin-top: 4px; }
  #simstats .dim { color: var(--dim); }
  #simstats .sub { font-size: 11px; margin: 0 0 4px; }
  #simstats .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  #simstats .bar { display: inline-block; height: 5px; width: 100%; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; vertical-align: middle; }
  #simstats .bar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
  #sBlocksBar { margin: 3px 0 2px; }
  #sCourse { font-size: 12px; }
  #simstats .stock { display: grid; grid-template-columns: 112px 1fr 44px; align-items: center; gap: 6px; font-size: 12px; }
  #simstats .stock b { font-weight: 600; text-align: right; }
  #simstats table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  #simstats th, #simstats td { padding: 1px 0; text-align: right; font-weight: 400; }
  #simstats thead th { color: var(--dim); font-size: 10px; }
  #simstats tbody th { text-align: left; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #simstats td { width: 38px; }
  #simstats tr.hot td:first-of-type { color: var(--gold); font-weight: 600; }
  #simstats .spark { position: relative; margin-top: 3px; }
  #sSpark { display: block; width: 100%; height: 54px; cursor: crosshair; }
  #sTip { position: absolute; top: -20px; display: none; padding: 1px 6px; border-radius: 5px; background: rgba(20,14,8,0.9); font-size: 11px; white-space: nowrap; pointer-events: none; }
  #simstats .foot { margin-top: 8px; font: 10px/1.4 ui-monospace, Menlo, monospace; color: var(--dim); }
  @media (max-width: 1100px) { #timeline { left: 12px; right: 12px; } #left, #rooms { top: 104px; } #left { max-height: calc(100% - 174px); } }
  @media (max-width: 900px) { #rooms { top: auto; bottom: 60px; } #hint { top: auto; bottom: 60px; } }
  @media (max-width: 640px) { #left { width: auto; right: 12px; max-height: calc(100% - 330px); } #controls { left: 12px; flex-wrap: wrap; } #courses { width: 100px; } #rooms { width: auto; left: 12px; grid-template-columns: 1fr 1fr; bottom: 110px; } #timeline .hide-s { display: none; } #clockSub { display: none; } }
</style>
</head>
<body>
<div id="timeline" class="glass">
  <div class="trow">
    <button id="play" title="Play / pause (P or Space)">▶</button>
    <button id="speed" title="Speed in working time per second: click for faster, shift-click or right-click for slower">1 month/s</button>
    <span class="tsep"></span>
    <button id="toStart" class="hide-s" title="The first day">⏮</button>
    <button id="prevMonth" title="Back one month (Shift+←)">◂◂</button>
    <button id="prevDay" title="Back one day (←)">◂</button>
    <div id="track"><input id="scrub" type="range" min="0" max="6000" step="1" value="6000" aria-label="Working day of the build"><div id="marks"></div><div id="years"></div></div>
    <button id="nextDay" title="Forward one day (→)">▸</button>
    <button id="nextMonth" title="Forward one month (Shift+→)">▸▸</button>
    <button id="toEnd" class="hide-s" title="The capstone set">⏭</button>
  </div>
  <div class="crow"><span id="clock">Starting the event model…</span><span id="clockSub"></span><span id="milestone"></span></div>
</div>
<div id="left">
  <div id="status" class="glass">
    <h1>Khufu's pyramid · Giza</h1>
    <div id="where">The finished monument, c. 2560 BC</div>
    <div id="note"></div>
    <div id="stats">–</div>
    <a id="back" href="./index.html">← Pyramid Builders (the small pyramid)</a>
  </div>
  <div id="simstats" class="glass"></div>
</div>
<div id="rooms" class="glass"><h2>Walk to</h2></div>
<div id="hint" class="glass">WASD walk · drag to look (or click to lock the mouse) · Shift run · Space climb · Esc release</div>
<div id="cross"></div>
<div id="climb" class="glass">Space · climb up</div>
<div id="controls" class="glass">
  <label title="Jump to the day this course was finished (a section through the rooms)">Courses <input id="courses" type="range" min="1" max="215" step="1" value="215"><span id="courseLabel"></span></label>
  <span class="sep"></span>
  <button id="xray" title="See through the masonry (X)">X-ray</button>
  <button id="walk" title="First-person walking (F)">Walk</button>
  <button id="follow" title="Follow the sled gang nearest the middle of the view (G)">Follow</button>
</div>
<script type="module" src="/src/khufu/main.js"></script>
</body>
</html>
